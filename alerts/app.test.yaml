rule_files:
  - app.rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="demo",path="/work",status="200"}'
        values: '0+54x65'
      - series: 'http_requests_total{namespace="demo",path="/work",status="500"}'
        values: '0+6x65'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="demo",pod="p",container="app",reason="OOMKilled",uid="u"}'
        values: '0 1+0x14'
      - series: 'kube_pod_container_status_restarts_total{namespace="demo",pod="p",container="app",uid="u"}'
        values: '0 1+0x14'
    alert_rule_test:
      - eval_time: 2m
        alertname: PodOOMKilled
        exp_alerts:
          - exp_labels: {namespace: demo, pod: p, container: app, reason: OOMKilled, uid: u, severity: warning}
            exp_annotations: {summary: A demo container restarted after an out-of-memory kill}
      - eval_time: 65m
        alertname: HighBurnRate
        exp_alerts:
          - exp_labels: {namespace: demo, severity: page}
            exp_annotations: {summary: The availability error budget is burning quickly}
      - eval_time: 65m
        alertname: SLOAvailabilityBreach
        exp_alerts:
          - exp_labels: {namespace: demo, severity: warning}
            exp_annotations: {summary: The availability SLO is below target over the observed window}
  - interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="demo",path="/work",status="200"}'
        values: '0+60x65'
    alert_rule_test:
      - eval_time: 65m
        alertname: HighBurnRate
        exp_alerts: []
      - eval_time: 65m
        alertname: SLOAvailabilityBreach
        exp_alerts: []
