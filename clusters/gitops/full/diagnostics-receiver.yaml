apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diagnostics-receiver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ops
  source:
    repoURL: https://github.com/siiick-brain/Self-healing-Container-platforma.git
    targetRevision: main
    path: ops/receiver/k8s
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
