configs:
  cm:
    resource.customizations.health.argoproj.io_Application: |
      local health = {status = "Progressing", message = "Waiting for child application"}
      if obj.status ~= nil and obj.status.health ~= nil then
        health.status = obj.status.health.status
        health.message = obj.status.health.message or ""
        if obj.status.sync == nil or obj.status.sync.status ~= "Synced" then
          health.status = "Progressing"
        end
      end
      return health
notifications:
  enabled: false
dex:
  enabled: false
