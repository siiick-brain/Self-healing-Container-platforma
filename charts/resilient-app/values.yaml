image:
  repository: ghcr.io/siiick-brain/resilient-app
  tag: main
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  timeoutSeconds: 1
  periodSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http
  timeoutSeconds: 1
  periodSeconds: 2
  failureThreshold: 2

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

diagnostics:
  enabled: true
  mountPath: /diagnostics
  sizeLimit: 32Mi

chaosEnabled: false

env: []

networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring
  dnsNamespace: kube-system
  dnsPodLabels:
    k8s-app: kube-dns

serviceMonitor:
  enabled: false
  labels:
    release: kube-prometheus-stack
  interval: 15s

rollouts:
  enabled: false
  canary:
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - setWeight: 33
      - pause:
          duration: 2m
  analysis:
    enabled: false
    templateName: resilient-app-success
