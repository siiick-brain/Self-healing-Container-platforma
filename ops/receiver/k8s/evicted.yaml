apiVersion: v1
kind: ServiceAccount
metadata:
  name: evicted-cleanup
  namespace: ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evicted-cleanup
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evicted-cleanup
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evicted-cleanup
subjects:
  - kind: ServiceAccount
    name: evicted-cleanup
    namespace: ops
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: evicted-cleanup
  namespace: ops
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: evicted-cleanup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: ghcr.io/siiick-brain/diagnostics-receiver:main
              args: [purge-evicted]
              resources:
                requests:
                  cpu: 25m
                  memory: 48Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
