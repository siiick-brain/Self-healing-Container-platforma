apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnostics-receiver
  namespace: ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: diagnostics-reader
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: diagnostics-reader
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: diagnostics-reader
subjects:
  - kind: ServiceAccount
    name: diagnostics-receiver
    namespace: ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostics-receiver
  namespace: ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diagnostics-receiver
  template:
    metadata:
      labels:
        app: diagnostics-receiver
    spec:
      serviceAccountName: diagnostics-receiver
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: ghcr.io/siiick-brain/diagnostics-receiver:main
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: diagnostics-minio
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: diagnostics-minio
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: diagnostics-receiver
  namespace: ops
spec:
  selector:
    app: diagnostics-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: diagnostics-webhook
  namespace: ops
spec:
  podSelector:
    matchLabels:
      app: diagnostics-receiver
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 8080
